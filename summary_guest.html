<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Guest</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
     <link rel="stylesheet" href="css/card.css">
</head>
<body>
    <header>
        Kanban Project Management Tool
        <div class="header-right">
        <a href="help.html" class="help-btn" aria-label="Help">?</a>
        <span class="user-initials" id="userInitials"></span>
        </div>
    </header>
    <div class="menu-line">
        <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="menu-logo">
        <div class="menu-icons">
            <a href="summary_guest.html" class="active"><img src="assets/imgs/summary.png" class="menu-icons-img" alt="Summary"></a>
            <a href="addTask.html"><img src="assets/imgs/addtask.png" class="menu-icons-img" alt="Add Task"></a>
            <a href="board.html"><img src="assets/imgs/board.png" class="menu-icons-img" alt="Board"></a>
            <a href="contacts.html"><img src="assets/imgs/contacts.png" class="menu-icons-img" alt="Contacts"></a>
        </div>
        <div class="policies">
            <a href="privacyPolicy.html" class="footer-link">Privacy Policy</a>
            <a href="legalNotice.html" class="footer-link">Legal notice</a>
        </div>
    </div>
    <main class="page">
        <div class="help-heading-blue-line"><h1>Join 360</h1><img src="assets/imgs/blue-line.png" alt="Line Icon" class="blue-line">
        <span>Key Metrics at a Glance</span></div>
        <!-- <br><br> -->
        <div class="summary-1Line">
            <div class="stat-card">        
                <p class="stat-number"><img src="assets/imgs/pencil-icon-circle-black.png" alt="To-do Icon" class="pencil-icon">2</p>
                <p class="stat-label">To-do</p>
            </div>

            <div class="stat-card">        
                <p class="stat-number"><img src="assets/imgs/hook-icon.png" alt="To-do Icon" class="pencil-icon">1</p>
                <p class="stat-label">Done</p>
            </div>
        </div>

        <div class="second-line">
            <div class="stat-card-wide">
                    <img src="assets/imgs/red-arrow-circle.png" alt="To-do Icon" class="red-arrow-circle-icon">
                    <div class="stat-number-col">
                        <span class="stat-number">2</span>
                        <span class="stat-label">Urgent</span>
                    </div>
                    <img src="assets/imgs/white-line.png" alt="Line" class="white-line">
                    <div class="date-col">
                        <span class="date-txt"><b>July 29, 2026</b></span>
                        <span class="date-condition">Uprising Date</span>
                    </div>
            </div>
            <span class="greetings"><b>Good morning!</b></span>
        </div>

   

        <div class="summary-1Line">
            <div class="stat-card-small">        
                <p class="stat-number">6</p>
                <p class="third-line-txt">Tasks in<br>Board</p>
            </div>

            <div class="stat-card-small">        
                <p class="stat-number">3</p>
                <p class="third-line-txt">Tasks in Progress</p>
            </div>

             <div class="stat-card-small">        
                <p class="stat-number">3</p>
                <p class="third-line-txt">Awaiting Feedback</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        
    </footer>
    <script src="script.js"></script>
</body>
</html>
