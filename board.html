<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_Board</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="./css/addTask.css">

</head>
<body onload="renderUserInitials()" onclick="closeUserMenu(event)">
    <header>
        Kanban Project Management Tool
        <div class="header-right">
        <a href="help.html" class="help-btn" aria-label="Help">?</a>
        <div class="user-menu" id="userMenu">
          <span class="user-initials" id="userInitials" onclick="toggleUserMenu()"></span>
          <div class="user-dropdown">
            <a href="legalNotice.html">Legal Notice</a>
            <a href="privacyPolicy.html">Privacy Policy</a>
            <a onclick="logout()">Log out</a>
          </div>
        </div>
        </div>
    </header>
    <div class="menu-line">
        <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="menu-logo">
        <div class="menu-icons">
            <a href="summary_guest.html"><img src="assets/imgs/summary.png" class="menu-icons-img" alt="Summary"></a>
            <a href="addTask.html"><img src="assets/imgs/addtask.png" class="menu-icons-img" alt="Add Task"></a>
            <a href="board.html" class="active"><img src="assets/imgs/board.png" class="menu-icons-img" alt="Board"></a>
            <a href="contacts.html"><img src="assets/imgs/contacts.png" class="menu-icons-img" alt="Contacts"></a>
        </div>
        <div class="policies">
            <a href="privacyPolicy.html" class="footer-link">Privacy Policy</a>
            <a href="legalNotice.html" class="footer-link">Legal notice</a>
        </div>
    </div>
    <div class="app-shell">
        <main class="board-mask">

            <div class="page-header">
                <div>
                    <h1>Board</h1>
                </div>
                <div class="page-actions">
                    <label class="search-input">
                        <input type="text" id="searchInput" oninput="findTask()" placeholder="Find Task">
                        <span><img src="./assets/icons/searchlens.png" alt="search"></span>
                    </label>
                    <button class="add-task-button" onclick="openAddTaskDialog('todo')">Add Task +</button>
                </div>
            </div>

            <section class="drag-container">

                <section class="column">
                <div class="column-header">  
                <h2>To Do</h2>
                <button onclick="openAddTaskDialog('todo')"><img src="./assets/icons/plus_add_task.png" alt="add task"></button>
                </div>
                <div class="drag-area" id="todo" ondrop="moveTo('todo')" ondragleave="removeHighlight('todo')"
                    ondragover="allowDrop(event); highlight('todo')"></div>
            </section>

            <section class="column">
                <div class="column-header">  
                <h2>In Progress</h2>
                <button onclick="openAddTaskDialog('in-progress')"><img src="./assets/icons/plus_add_task.png" alt="add task"></button>
                </div>
                <div class="drag-area" id="in-progress" ondrop="moveTo('in-progress')" ondragleave="removeHighlight('in-progress')"
                    ondragover="allowDrop(event); highlight('in-progress')"></div>
            </section>

            <section class="column">
                <div class="column-header">  
                <h2>Await feedback</h2>
                <button onclick="openAddTaskDialog('await-feedback')"><img src="./assets/icons/plus_add_task.png" alt="add task"></button>
                </div>
                <div class="drag-area" id="await-feedback" ondrop="moveTo('await-feedback')" ondragleave="removeHighlight('await-feedback')"
                    ondragover="allowDrop(event); highlight('await-feedback')"></div>
            </section>

            <section class="column">
                <div class="column-header">  
                <h2>Done</h2>
                </div>
                <div class="drag-area" id="done" ondrop="moveTo('done')" ondragleave="removeHighlight('done')"
                    ondragover="allowDrop(event); highlight('done')"></div>
            </section>


        </section>

        </main>
        
        <div id="add-task-modal" class="modal-overlay hidden" onclick="closeAddTaskDialog(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <button class="modal-close" onclick="closeAddTaskDialog()">&times;</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
            </div>
        </div>

        <div id="task-detail-modal" class="modal-overlay hidden" onclick="closeTaskDetail(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div id="task-detail-body" class="modal-body"></div>
            </div>
        </div>
        <div id="center-toast" class="center-toast"></div>
    </div>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="./assets/templates/addTaskTemplate.js"></script>
    <script src="./assets/templates/boardTemplates.js"></script>
    <script src="scripts/board.js"></script>
    <script src="scripts/boardEdit.js"></script>
    <script src="./scripts/tasks.js"></script>
</body>
</html>
