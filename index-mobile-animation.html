<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_Login</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        /* .login-main braucht position: relative als Bezugsrahmen fuer das Overlay */
        .login-main {
            position: relative;
        }

        /* Intro-Overlay: deckt den Login-Inhalt kurz zu und blendet dann weg */
        
        @media (min-width: 769px) {
            .intro-overlay {
                position: absolute;
                inset: 0;
                z-index: 10;
                background-color: #F6F7F8;
                background-image: url('assets/imgs/logoMain.png');
                background-size: 15%;
                background-repeat: no-repeat;
                background-position: center;
                animation: introFade 500ms ease 1s forwards;
            }
        }


         @media (max-width: 768px) {
            .intro-overlay {
                position: absolute;
                inset: 0;
                background-color: var(--color-primary);
                z-index: 10;
                animation: introFade 500ms ease 1s forwards;
            }
        }

        @keyframes introFade {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }


        /* Logo-Intro: startet gross in der Bildschirmmitte, fliegt dann zur
           echten Header-Position (top:24px; left:40px).
           Position und Groesse sind bewusst getrennte Keyframes, damit die
           Groesse unten per Media-Query fuer Mobile ueberschrieben werden
           kann, ohne die Positions-Animation duplizieren zu muessen. */
        @keyframes logoIntroPosition {
            from {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            to {
                top: 24px;
                left: 40px;
                transform: translate(0, 0);
            }
        }

         @keyframes logoIntroSize {
            from {
                width: 200px;
            }
            to {
                width: 100px;
            }
        } 

        @media (max-width: 768px) {
            @keyframes logoIntroSize {
                from {
                    width: 120px;
                }
                to {
                    width: 60px;
                }
            }
        }

       /*ease-in-out → startet langsam, wird in der Mitte am schnellsten, 
       wird zum Ende hin wieder langsam. Wirkt dadurch weich/organisch statt abrupt */

        /*forwards → nach Ende der Animation bleibt der letzte Keyframe-Zustand (das to {})
         erhalten, statt zurückzuspringen. */

         @media (max-width: 768px) {
            .login-logo {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 200px;
                transform: translate(-50%, -50%);
                 animation: logoIntroPosition 1.5s ease-in-out 0.3s forwards,
                            logoIntroSize 1.5s ease-in-out 0.3s forwards; 
                z-index: 10;
            }
         }
        /* Crossfade: weisses Logo blendet aus, farbiges Logo blendet ein,
           waehrend beide gleichzeitig die logoIntro-Bewegung mitmachen. */
        @keyframes fadeOutLogo {
            to { opacity: 0; }
        }

        @keyframes fadeInLogo {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .login-logo-white {
                animation: logoIntroPosition 1.5s ease-in-out 0.3s forwards,
                        logoIntroSize 1.5s ease-in-out 0.3s forwards,
                        fadeOutLogo 1.5s ease-in-out 0.3s forwards;
            }
        }

        @media (max-width: 768px) {
            .login-logo-color {
                opacity: 0;
                animation: logoIntroPosition 1.5s ease-in-out 0.3s forwards,
                        logoIntroSize 1.5s ease-in-out 0.3s forwards,
                        fadeInLogo 1.5s ease-in-out 0.3s forwards;
            }
        }


    </style>
</head>
<body>
    <div class="page-frame">
        <div class="intro-overlay"></div>
    <a href="index.html">
        <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="login-logo login-logo-white">
        <img src="assets/imgs/logoMain.png" alt="Join Logo" class="login-logo login-logo-color">
    </a>

    <header class="login-header">
        <span class="login-header-text">Not a Join user?</span>
        <button class="btn btn-primary" type="button" onclick="signUp()">Sign up</button>
    </header>

    <main class="login-main">
        <form class="login-form" novalidate>
            <h1>Log in</h1>
            <div class="input-wrapper">
                <input class="input" type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <img src="assets/icons/email.png" alt="" class="input-icon">
            </div>
            <div class="input-wrapper">
                <input class="input" type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button type="button" class="input-icon-btn" id="loginPasswordToggle" aria-label="Show password"
                        onclick="togglePassword('loginPassword')" disabled>
                    <img src="assets/icons/lock.png" alt="" id="loginPasswordIcon">
                </button>
            </div>
            <span id="loginError" class="error-message"></span>
            <div class="login-buttons">
                <button class="btn btn-primary" type="button" onclick="login()">Log in</button>
                <button class="btn btn-secondary" type="button" onclick="guestLogin()">Guest Log in</button>
            </div>
        </form>
        <div class="login-container-mobile">
            <span class="login-header-text">Not a Join user?</span>
            <button class="btn btn-primary" type="button" onclick="signUp()">Sign up</button>
        </div>

    </main>

    <footer class="footer">
        <a href="privacyPolicy.html" class="footer-link-index">Privacy Policy</a>
        <a href="legalNotice.html" class="footer-link-index">Legal notice</a>
    </footer>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="scripts/validation.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
