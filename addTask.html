<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_Add_Task</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/addTask.css">

    <script src="assets/templates/addTaskTemplate.js"></script>
    <script src="scripts/tasks.js"></script>
    <script src="scripts/test.js"></script>
</head>

<body onload="init()">
    <header >
        Kanban Project Management Tool
    </header>
    <div class="menu-line">
        <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="menu-logo">
        <!-- <a href="index.html" class="back-arrow"><img src="assets/imgs/summary.png" alt="Summary"></a> -->
    </div>


    <main>
        <h1>Add Task</h1>
        <form id="addTaskForm" onsubmit="submitTaskData()">
            <div class="input-form">
                <div class="input-area">
                    <label for="taskName">Title<span class="required">*</span></label>
                    <input class="input" type="text" id="taskName" name="taskName" required placeholder="Enter a title">

                    <label for="taskDescription">Description</label>
                    <textarea class="input" id="taskDescription" name="taskDescription"
                        placeholder="Enter a Description"></textarea>

                    <label for="taskDeadline">Due date<span class="required">*</span></label>
                    <input class="input" type="date" id="taskDeadline" name="taskDeadline" required>
                </div>

                <div class="divider"></div>

                
                <div class="input-area">
                    <label>Priority</label>
                    <div class="priority-buttons">
                        <button type="button" class="btn btn-secondary" id="btnUrgent">
                            Urgent
                            <!-- hier noch Bild rein mit doppel Pfeil nach oben -->
                        </button>
                        <button type="button" class="btn btn-secondary" id="btnMedium">
                            Medium
                            <!-- hier noch Bild rein mit Gleich Zeichen -->
                        </button>
                        <button type="button" class="btn btn-secondary" id="btnLow">
                            Low
                            <!-- hier noch Bild rein mit doppel Pfeil nach unten -->
                        </button>
                    </div>

                    <label for="assignedTo">Assigned to</label>
                    <div class="dropdown">
                        <div class="input-wrapper">
                            <input class="input pointer" id="assignedTo" type="text"
                                placeholder="Select contact to assign" oninput="searchList()"
                                onclick="toggleDropdown(`contactList`, `contactArrow`)">

                            <span class="input-img pointer arrow" id="contactArrow"
                                onclick="toggleDropdown(`contactList`, `contactArrow`)">▼</span>
                        </div>


                        <ul class="dropdown-list dropdown-scroll d-none" id="contactList">
                            <li class="contact-li">
                                <span class="avatar">
                                    NB
                                </span>
                                <span class="contact-name">
                                    Nick Balzer
                                </span>
                                <input class="contact-checkbox" type="checkbox">
                            </li>
                            <li class="contact-li">
                                <span class="avatar">
                                    NB
                                </span>
                                <span class="contact-name">
                                    Nick Balzer
                                </span>
                                <input class="contact-checkbox" type="checkbox">
                            </li>
                        </ul>
                    </div>

                    <label for="category">Category<span class="required">*</span></label>
                    <div class="dropdown">
                        <div class="input-wrapper">
                            <input class="input pointer" id="category" type="text" placeholder="Select task category"
                                oninput="searchList()" onclick="toggleDropdown(`categoryList`, `categoryArrow`)">

                            <span class="input-img pointer arrow" id="categoryArrow"
                                onclick="toggleDropdown(`categoryList`, `categoryArrow`)">▼</span>
                        </div>


                        <ul class="dropdown-list d-none" id="categoryList">
                            <li class="contact-li" onclick="chooseCategory(`Technical Task`)">
                                <span class="avatar">
                                    Technical Task
                                </span>
                            </li>
                            <li class="contact-li" onclick="chooseCategory(`User Story`)">
                                <span class="avatar">
                                    User Story
                                </span>
                            </li>
                        </ul>
                    </div>


                    <label for="subtask">Subtask</label>
                    <div class="add-subtask">
                        <div class="input-wrapper">
                            <input class="input" id="subtask" type="text" placeholder="Add new subtask">

                            <img src="" alt="">
                            <span class="input-img subtask-divider">/</span>
                            <img src="" alt="">
                        </div>
                    </div>

                </div>
            </div>

            <div class="submit-form">
                <span class="required-hint"><span class="required">*</span>This field is required</span>
                <div class="button-area">
                    <!-- Bilder einfügen mit x und Hacken -->
                    <button type="reset" class="btn btn-secondary btnTask">
                        <span>Clear</span>
                        <img class="formBtnImages" src="assets/icons/close.svg" alt="x symbole for close">
                    </button>
                    <button type="submit" class="btn btn-primary">Create Task </button>
                </div>
            </div>

        </form>
    </main>


</body>

</html>
