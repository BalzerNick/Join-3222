<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_Add_Task</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/addTask.css">
    <link rel="stylesheet" href="css/addTaskMobile.css">
</head>

<body onclick="closeUserMenu(event); closeAllDropdowns()">
    <header>
        <span class="header-title">Kanban Project Management Tool</span>
        <img src="assets/imgs/logoMain.png" alt="Join Logo" class="header-logo-mobile">
        <div class="header-right">
            <a href="help.html" class="help-btn" aria-label="Help">?</a>
            <div class="user-menu" id="userMenu">
                <span class="user-initials" id="userInitials" onclick="toggleUserMenu()"></span>
                <div class="user-dropdown">
                    <a href="help.html" class="watchable">Help</a>
                    <a href="legalNotice.html">Legal Notice</a>
                    <a href="privacyPolicy.html">Privacy Policy</a>
                    <a onclick="logout()">Log out</a>
                </div>
            </div>
        </div>
    </header>
    <div class="menu-line">
        <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="menu-logo">
        <div class="menu-icons">
            <a href="summary_guest.html"><img src="assets/imgs/summary.png" class="menu-icons-img menu-icons-img-desktop" alt="Summary"><span class="menu-icons-mobile"><img src="assets/icons/navbar/summary_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Summary</span></span></a>
            <a href="addTask.html" class="active"><img src="assets/imgs/addtask.png" class="menu-icons-img menu-icons-img-desktop"
                    alt="Add Task"><span class="menu-icons-mobile"><img src="assets/icons/navbar/addTask_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Add Task</span></span></a>
            <a href="board.html"><img src="assets/imgs/board.png" class="menu-icons-img menu-icons-img-desktop" alt="Board"><span class="menu-icons-mobile"><img src="assets/icons/navbar/board_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Board</span></span></a>
            <a href="contacts.html"><img src="assets/imgs/contacts.png" class="menu-icons-img menu-icons-img-desktop" alt="Contacts"><span class="menu-icons-mobile"><img src="assets/icons/navbar/contacts_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Contacts</span></span></a>
        </div>
        <div class="policies">
            <a href="privacyPolicy.html" class="footer-link">Privacy Policy</a>
            <a href="legalNotice.html" class="footer-link">Legal Notice</a>
        </div>
    </div>
    <main>
        <h1>Add Task</h1>
        <form id="addTaskForm" novalidate onsubmit="submitTaskData(event)" onreset="resetTask()">
            <div class="input-form">
                <div class="input-area">
                    <label for="taskName">Title<span class="required">*</span></label>
                    <input class="input" type="text" id="taskName" name="taskName" required placeholder="Enter a title">
                    <span id="taskNameError" class="field-error"></span>

                    <label for="taskDescription">Description</label>
                    <textarea class="input" id="taskDescription" name="taskDescription"
                        placeholder="Enter a Description"></textarea>

                    <label for="taskDeadline">Due date<span class="required">*</span></label>
                    <input class="input" type="date" id="taskDeadline" name="taskDeadline" required>
                    <span id="taskDeadlineError" class="field-error"></span>
                </div>

                <div class="divider"></div>


                <div class="input-area">
                    <label>Priority</label>
                    <div class="priority-buttons">
                        <button type="button" class="btn btn-secondary btn-task btn-priority-urgent" id="btnUrgent"
                            onclick="selectPriority('urgent')">
                            <span>Urgent</span>
                            <img class="medium" src="assets/icons/arrow up.svg" data-icon="assets/icons/arrow up.svg"
                                data-icon-selected="assets/icons/arrow up_choosed.svg" alt="Urgent priority icon">
                        </button>
                        <button type="button" class="btn btn-secondary btn-task btn-priority-medium selected"
                            id="btnMedium" onclick="selectPriority('medium')">
                            <span>Medium</span>
                            <img class="medium" src="assets/icons/=_choosed.svg" data-icon="assets/icons/=.svg"
                                data-icon-selected="assets/icons/=_choosed.svg" alt="Medium priority icon">
                        </button>
                        <button type="button" class="btn btn-secondary btn-task btn-priority-low" id="btnLow"
                            onclick="selectPriority('low')">
                            <span>Low</span>
                            <img class="medium" src="assets/icons/arrow down.svg"
                                data-icon="assets/icons/arrow down.svg"
                                data-icon-selected="assets/icons/arrow down_choosed.svg" alt="Low priority icon">
                        </button>
                    </div>

                    <label for="assignedTo">Assigned to</label>
                    <div class="dropdown" onclick="noEvent(event)">
                        <div class="input-wrapper">
                            <input class="input pointer" id="assignedTo" type="text"
                                placeholder="Select contacts to assign" autocomplete="off" oninput="searchList()"
                                onclick="toggleDropdown(`contactList`, `contactArrow`)">

                            <img class="input-img pointer arrow" id="contactArrow"
                                src="assets/icons/arrow_drop_down_down.svg" alt="Toggle dropdown"
                                onclick="toggleDropdown(`contactList`, `contactArrow`)">
                        </div>


                        <ul class="dropdown-list dropdown-scroll d-none" id="contactList">

                        </ul>
                    </div>

                    <div id="assignedContacts" class="assigned-contacts">

                    </div>

                    <label for="category">Category<span class="required">*</span></label>
                    <div class="dropdown" onclick="noEvent(event)">
                        <div class="input-wrapper">
                            <input class="input pointer" id="category" type="text" placeholder="Select task category"
                                autocomplete="off" oninput="searchList()"
                                onclick="toggleDropdown(`categoryList`, `categoryArrow`)" required>

                            <img class="input-img pointer arrow" id="categoryArrow"
                                src="assets/icons/arrow_drop_down_down.svg" alt="Toggle dropdown"
                                onclick="toggleDropdown(`categoryList`, `categoryArrow`)">
                        </div>

                        <ul class="dropdown-list d-none" id="categoryList">
                            <li class="contact-li" onclick="chooseCategory(`Technical Task`)">
                                <span class="category-label">
                                    Technical Task
                                </span>
                            </li>
                            <li class="contact-li" onclick="chooseCategory(`User Story`)">
                                <span class="category-label">
                                    User Story
                                </span>
                            </li>
                        </ul>
                    </div>
                    <span id="categoryError" class="field-error"></span>

                    <label for="subtask">Subtasks</label>
                    <div class="add-subtask">
                        <div class="input-wrapper">
                            <input class="input" id="subtask" type="text" placeholder="Add new subtask" autocomplete="off" oninput="showButtons()"
                                onkeydown="if(event.key === 'Enter'){ event.preventDefault(); safeSubtask(); }">
                            <div class="subtask-buttons input-img d-none" id="subtaskButtons">
                                <img class="input-img subtask-icon pointer" src="assets/icons/close.svg" alt="x" onclick="clearSubtask()">
                                <span>|</span>
                                <img class="input-img subtask-icon pointer" src="assets/icons/check_black.svg" alt="Add subtask" onclick="safeSubtask()">
                            </div>
                            
                        </div>
                        <div class="subtask-area" id="subtaskArea">

                        </div>
                    </div>

                    <span class="required-hint required-hint-subtask"><span class="required">*</span>This field is required</span>

                </div>
            </div>
        </form>
    </main>

    <footer id="addTaskFooter">
        <div class="submit-form">
            <span class="required-hint required-hint-footer"><span class="required">*</span>This field is required</span>
            <div class="button-area">
                <button type="reset" form="addTaskForm" class="btn btn-secondary btn-task">
                    <span>Clear</span>
                    <img class="btn-img" src="assets/icons/close.svg" alt="x symbole for close">
                </button>
                <button type="submit" form="addTaskForm" class="btn btn-primary btn-task">
                    <span>Create Task</span>
                    <img class="btn-img" src="assets/icons/check.svg" alt=" symbole for submit">
                </button>
            </div>
        </div>
    </footer>


    <div id="toast" class="toast"></div>
    <script src="firebase-config.js"></script>
    <script src="scripts/variables.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/api.js"></script>
    <script src="assets/templates/addTaskTemplate.js"></script>
    <script src="scripts/tasks.js"></script>
    <script src="script.js"></script>
    <script src="scripts/spaceGuard.js"></script>
    <script src="scripts/rotateGuard.js"></script>
    <script src="scripts/validation.js"></script>
    <script src="scripts/validationAddTask.js"></script>
</body>

</html>
