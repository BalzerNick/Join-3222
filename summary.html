    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_Contacts</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/contacts.css">
    <link rel="stylesheet" href="css/card.css">
    <script src="firebase-config.js"></script>
    <script src="./scripts/summary.js"></script>
</head>
<body onload="renderContacts(); displayUserInitials();">
    <header>
        Kanban Project Management Tool
        <div class="header-right">
        <a href="help.html" class="help-btn" aria-label="Help">?</a>
        <span class="user-initials" id="userInitials"></span>
        </div>
    </header>


        <div class="menu-line">
            <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="menu-logo">
            
            <div class="menu-icons">
                <img src="assets/imgs/summary.png" class="menu-icons-img menu-icons-img-desktop" alt="Menu Icon"><span class="menu-icons-mobile"><img src="assets/icons/navbar/summary_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Summary</span></span>
                <img src="assets/imgs/addtask.png" class="menu-icons-img menu-icons-img-desktop" alt="Menu Icon"><span class="menu-icons-mobile"><img src="assets/icons/navbar/addTask_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Add Task</span></span>
                <img src="assets/imgs/board.png" class="menu-icons-img menu-icons-img-desktop" alt="Menu Icon"><span class="menu-icons-mobile"><img src="assets/icons/navbar/board_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Board</span></span>
                <img src="assets/imgs/contacts.png" class="menu-icons-img menu-icons-img-desktop" alt="Menu Icon"><span class="menu-icons-mobile"><img src="assets/icons/navbar/contacts_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Contacts</span></span>
            </div>    
            <!-- <a href="index.html" class="back-arrow"><img src="assets/imgs/summary.png" alt="Summary"></a> -->
            <div class="policies">
                <a href="privacyPolicy.html" class="footer-link">Privacy Policy</a>
                <a href="legalNotice.html" class="footer-link">Legal notice</a>
            </div>
        </div>
    <!-- <a href="index.html" class="back-arrow">&larr;</a> -->

    <main class="page-summary">
        <div class="help-heading-blue-line"><h1 class="join">Join 360</h1><img src="assets/imgs/blue-line.png" alt="Line Icon" class="blue-line">
        <span class="key">Key Metrics at a Glance</span></div>
        <!-- <br><br> -->
        <div class="summary-1Line">
            <div class="stat-card">
                <div class="stat-number-row">
                    <img src="assets/imgs/pencil-icon-circle-black.png" alt="To-do Icon" class="pencil-icon">
                    <span class="stat-number" id="todoCount">0</span> 
                </div>
                <p class="stat-label">To-do</p>
            </div>

            <div class="stat-card">
                <div class="stat-number-row">
                    <img src="assets/imgs/hook-icon.png" alt="To-do Icon" class="pencil-icon">
                    <span class="stat-number" id="doneCount">0</span>
                </div>
                <p class="stat-label">Done</p>
            </div>
        </div>

        <div class="second-line">
            <div class="stat-card-wide">
                    <img src="assets/imgs/red-arrow-circle.png" alt="To-do Icon" class="red-arrow-circle-icon">
                    <div class="stat-number-col">
                        <span class="stat-number" id="urgentCount">0</span>
                        <span class="stat-label">Urgent</span>
                    </div>
                    <img src="assets/imgs/white-line.png" alt="Line" class="white-line">
                    <div class="date-col">
                        <span><b class="date-txt" id="uprisingdate">01.01.1999</b></span>
                        <span class="date-condition">Uprising Date</span>
                    </div>
            </div>
            <div class="greeting-block">
                <p class="greetings" id="greetingtag">Good morning,</p>
                <b><p class="user" id="loginuser"></p></b>
            </div>
        </div>

   

        <div class="summary-1Line">
            <div class="stat-card-small">        
                <p class="stat-number" id="boardCount">0</p>
                <p class="third-line-txt">Tasks in<br>Board</p>
            </div>

            <div class="stat-card-small">        
                <p class="stat-number" id="inProgressCount">0</p>
                <p class="third-line-txt">Tasks in Progress</p>
            </div>

             <div class="stat-card-small">        
                <p class="stat-number" id="awaitFeedbackCount">0</p>
                <p class="third-line-txt">Awaiting Feedback</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        
    </footer>
</body>
</html>
