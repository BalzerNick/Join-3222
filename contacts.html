<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_Contacts</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/contacts.css">
</head>
<body onclick="closeUserMenu(event); closeContactMenu(event)">
    <header>
        <span class="header-title">Kanban Project Management Tool</span>
        <img src="assets/imgs/logoMain.png" alt="Join Logo" class="header-logo-mobile">
        <div class="header-right">
        <a href="help.html" class="help-btn" aria-label="Help">?</a>
        <div class="user-menu" id="userMenu">
          <span class="user-initials" id="userInitials" onclick="toggleUserMenu()"></span>
          <div class="user-dropdown">
            <a href="help.html" class="watchable">Help</a>
            <a href="legalNotice.html">Legal Notice</a>
            <a href="privacyPolicy.html">Privacy Policy</a>
            <a onclick="logout()">Log out</a>
          </div>
        </div>
        </div>
    </header>
    <div class="menu-line">
        <img src="assets/imgs/logoMainWhite.png" alt="Join Logo" class="menu-logo">
        <div class="menu-icons">
            <a href="summary_guest.html"><img src="assets/imgs/summary.png" class="menu-icons-img menu-icons-img-desktop" alt="Summary"><span class="menu-icons-mobile"><img src="assets/icons/navbar/summary_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Summary</span></span></a>
            <a href="addTask.html"><img src="assets/imgs/addtask.png" class="menu-icons-img menu-icons-img-desktop" alt="Add Task"><span class="menu-icons-mobile"><img src="assets/icons/navbar/addTask_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Add Task</span></span></a>
            <a href="board.html"><img src="assets/imgs/board.png" class="menu-icons-img menu-icons-img-desktop" alt="Board"><span class="menu-icons-mobile"><img src="assets/icons/navbar/board_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Board</span></span></a>
            <a href="contacts.html" class="active"><img src="assets/imgs/contacts.png" class="menu-icons-img menu-icons-img-desktop" alt="Contacts"><span class="menu-icons-mobile"><img src="assets/icons/navbar/contacts_img.svg" class="menu-icons-img-mobile" alt=""><span class="menu-icons-label">Contacts</span></span></a>
        </div>
        <div class="policies">
            <a href="privacyPolicy.html" class="footer-link">Privacy Policy</a>
            <a href="legalNotice.html" class="footer-link">Legal Notice</a>
        </div>
    </div>
    <main class="content contacts-main">
        <div class="contacts-list-col">
            <button class="btn btn-primary add-contact-btn" type="button" onclick="openAddContact()">
                Add new contact
                <img src="assets/icons/person_add.svg" alt="" class="btn-icon">
            </button>
            <div id="contactList"></div>
        </div>

        <div class="contact-detail">
            <div class="contacts-intro">
                <h1>Contacts</h1>
                <span class="contacts-intro-sub">Better with a team</span>
                <img src="assets/imgs/arrow.png" alt="Back" class="contacts-back" onclick="closeContactDetail()">
            </div>
            <div id="contactDetail"></div>
        </div>
    </main>

    <!-- Overlay fuer das Add-Contact-Popup, per JS befuellt.
         Ein Klick auf den abgedunkelten Rand schliesst das Popup. -->
    <div id="addContactOverlay" class="overlay d-none" onmousedown="pressAddContactBackdrop(event)"
        onclick="clickAddContactBackdrop(event)"></div>

    <!-- Toast: seitenuebergreifend, Text setzt showToast() -->
    <div id="toast" class="toast"></div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="scripts/spaceGuard.js"></script>
    <script src="./scripts/api.js"></script>
    <script src="./scripts/storage.js"></script>
    <script src="scripts/validation.js"></script>
    <script src="scripts/contacts.js"></script>
</body>
</html>
